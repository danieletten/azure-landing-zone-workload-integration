# FICTIONAL rendered platform contract for the Contoso Orders production workload.
# Generated by the platform team's subscription-vending process from
# platform-contract-defaults.yaml + product-lines/connected-online.yaml + vending outputs.
# Not an official Microsoft schema. Contains NO secrets. All values are invented.

apiVersion: workload-integration/v1
kind: PlatformContract

metadata:
  contractVersion: "1.4.0"
  generatedAt: "2026-08-04T09:00:00Z"
  sourceRepository: "https://github.com/contoso-example/platform-landing-zone"
  sourceRevision: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0"
  productLine: corp-connected-online
  platformOwner: Cloud Platform Team
  supportChannel: platform-requests@contoso.example

subscription:
  name: sub-contoso-orders-prod
  id: "00000000-0000-0000-0000-000000000000"
  environment: prod
  managementGroup: mg-corp-online
  workloadTeamRole: Contributor
  deploymentIdentityRole: Owner   # CI/CD identity, WORKLOAD-SUBSCRIPTION SCOPE only.
  # Central networking, shared subscriptions, central DNS, firewall, and policy remain
  # outside this identity's scope.

resourceProviders:
  registered:
    - Microsoft.Web
    - Microsoft.Sql
    - Microsoft.Storage
    - Microsoft.KeyVault
    - Microsoft.Network
  workloadMayRegister:
    - Microsoft.Insights
  requestRequired:
    - Microsoft.ContainerService

governance:
  allowedRegions: [westeurope, northeurope]
  requiredTags: [costCenter, owner, dataClassification]
  inheritedPolicyOutcomes:
    - "Deny: public network access for PaaS"
    - "DeployIfNotExists: diagnostic settings to law-corp-central"
    - "Modify: append required tags"
  exemptionProcess: "Request via platform queue; scoped + time-bound; last resort."

networking:
  virtualNetwork: vnet-orders-prod   # peered to the regional hub
  subnets:
    - name: snet-appservice-integration
      purpose: "App Service regional VNet Integration (outbound)."
      delegation: Microsoft.Web/serverFarms
      managedBy: platform
    - name: snet-private-endpoints
      purpose: "Private endpoints (App Service inbound, SQL, Storage, Key Vault)."
      delegation: none
      managedBy: platform
  egress: "Central Azure Firewall (forced tunnel)."
  workloadMayCreateSubnets: false
  requestProcess: "Peering, address space, and firewall rules via platform queue."

privateDns:
  integrationMechanism: policy-dine
  centralZones:
    - privatelink.azurewebsites.net
    - privatelink.database.windows.net
    - privatelink.blob.core.windows.net
    - privatelink.vaultcore.azure.net
  supportedServices: [App Service, Azure SQL, Storage (blob), Key Vault]
  workloadPermissions: "Reference approved zone groups; do not create central zones."
  requestProcess: "Not required for the zones above (automated by policy)."

identity:
  workloadRoleAssignmentPermissions: "Workload resource groups only; no MG/subscription-scope grants."
  sharedServiceAccessProcess: "Request cross-subscription roles via platform queue."

monitoring:
  centralWorkspace: law-corp-central
  diagnosticSettingsMechanism: policy-dine
  alertOwnership: workload-team

security:
  defenderConfiguration: "Defender for Cloud plans enabled by platform."
  publicNetworkAccessPolicy: "Denied for PaaS."
  dataClassificationRequirements: "Confidential data: CMK recommended (architecture decision)."

cost:
  budgetOwner: Contoso Orders team
  costCenter: CC-1234
  requiredTags: [costCenter, owner, dataClassification]

operations:
  incidentOwner: Contoso Orders on-call
  platformSupport: platform-requests@contoso.example
  requestSla: "5 business days"
